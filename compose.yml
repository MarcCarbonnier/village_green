services:

  web:
    build: .
    ports:
      - 8000:8000
    volumes:
      - ./:/var/www
    extra_hosts:
      - host.docker.internal:host-gateway

  db:
    image: mariadb:11.8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Code309
      MYSQL_DATABASE: village_green_fr
      MYSQL_USER: root
      MYSQL_PASSWORD: Code309
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1
